
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #333;
            text-align: center;
        }

        header {
            background: #155eef;
            color: white;
            padding: 25px;
        }

        main {
            padding: 60px 20px;
        }

        h1 {
            font-size: 40px;
            color: #155eef;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            background: #155eef;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #003db8;
        }

        footer {
            background: #222;
            color: white;
            padding: 20px;
            margin-top: 60px;
        }
    </style>
</head>

<body>

    <header>
        <h2>My First Website</h2>
    </header>

    <main>
        <h1>Welcome To My Website!</h1>

        <p>
            Hello! This is my first website hosted on GitHub Pages.
        </p>

        <p>
            I am learning HTML, CSS and web development.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>
    </main>

    <footer>
        <p>Copyright © 2026 My Website</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Congratulations! Your website is working!";
        }
    </script>

</body>
</html>
